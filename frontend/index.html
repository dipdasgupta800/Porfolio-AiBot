<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Dip's AI</title>
<style>
  :root {
    --paper: #eef1f5; --card: #ffffff; --ink: #1b2430; --muted: #5d6877;
    --accent: #2f5bea; --line: #d5dbe4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #12161c; --card: #1b212a; --ink: #e8ecf2; --muted: #98a3b3; --accent: #6f93ff; --line: #2c3541; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; display: flex; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 1.6rem; }
  p.sub { margin: 4px 0 0; color: var(--muted); }
  #log {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; }
  .bot { align-self: flex-start; background: var(--paper); }
  .error { align-self: flex-start; color: #c0392b; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 12px; font-size: 1rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button {
    padding: 12px 20px; font-size: 1rem; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ask Dip's AI</h1>
    <p class="sub">Ask about my skills, projects, education, or experience.</p>
  </header>

  <div id="log" aria-live="polite">
    <div class="msg bot">Hi! Ask me anything about Dip's background.</div>
  </div>

  <form id="form">
    <input id="q" placeholder="Type your question" autocomplete="off" required>
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script>
  // Change this to your deployed backend URL later.
  const API_URL = "https://dipaibot.onrender.com/chat";

  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");
  const log = document.getElementById("log");

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    send.disabled = true;
    const thinking = addMessage("Thinking...", "bot");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();
      thinking.textContent = data.answer;
    } catch (err) {
      thinking.className = "msg error";
      thinking.textContent = "Could not reach the server. Is the backend running? (" + err.message + ")";
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
