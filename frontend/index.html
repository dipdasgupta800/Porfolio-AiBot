<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dip Das Gupta | CSE student and backend developer</title>
<meta name="description" content="Portfolio of Dip Das Gupta with an AI assistant that answers questions about his resume.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f1f8; --ink: #17153a; --muted: #5d5a80; --line: #d9d6ea;
    --panel: #ffffff; --card: #1f1b5c; --card-ink: #ecebff; --card-soft: rgba(255,255,255,.09);
    --accent: #ffb547; --accent-ink: #2a1c00; --link: #3b36c9;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11102b; --ink: #ecebff; --muted: #a3a0c8; --line: #2b2859;
      --panel: #19174a; --card: #2a2587; --link: #a9a6ff;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 1.0625rem/1.6 var(--body);
  }
  a { color: var(--link); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  header .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 22px; padding-bottom: 22px; }
  .brand { font: 700 1.15rem var(--display); letter-spacing: -.01em; text-decoration: none; color: var(--ink); }
  nav a { margin-left: 24px; color: var(--muted); text-decoration: none; font-weight: 500; }
  nav a:hover { color: var(--ink); }

  .hero { display: grid; grid-template-columns: 1fr minmax(340px, 480px); gap: 56px; align-items: center; padding: 40px 0 72px; }
  h1 { font: 700 clamp(2.6rem, 6vw, 4.6rem)/1 var(--display); letter-spacing: -.035em; margin: 0 0 22px; }
  .lead { font-size: 1.2rem; color: var(--muted); max-width: 34ch; margin: 0 0 28px; }
  .cta { display: inline-block; padding: 13px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; text-decoration: none; }
  .cta:hover { opacity: .88; }

  .chat { background: var(--card); color: var(--card-ink); border-radius: 22px; display: flex; flex-direction: column; height: 560px; box-shadow: 0 30px 60px -30px rgba(31,27,92,.55); overflow: hidden; }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--card-soft); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 1.1rem var(--display); }
  .chat-head strong { display: block; font: 600 1rem var(--body); line-height: 1.2; }
  .chat-head span { font-size: .85rem; opacity: .7; }
  #reset { margin-left: auto; background: var(--card-soft); color: inherit; border: 0; border-radius: 999px; padding: 8px 14px; font: 500 .9rem var(--body); cursor: pointer; }
  #reset:hover { background: rgba(255,255,255,.17); }

  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; line-height: 1.55; overflow-wrap: anywhere; font-size: 1rem; }
  .bot { align-self: flex-start; background: var(--card-soft); border-bottom-left-radius: 4px; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .error { align-self: flex-start; background: rgba(255,120,120,.18); border-bottom-left-radius: 4px; }
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 4px 0 8px; padding-left: 20px; }
  .bot a { color: var(--accent); }
  .dots { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .4; animation: blink 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .note { font-size: .85rem; opacity: .75; margin-top: 6px; }

  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 12px; }
  #chips button { background: transparent; color: inherit; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 7px 13px; font: 500 .9rem var(--body); cursor: pointer; }
  #chips button:hover { background: var(--card-soft); }
  #form { display: flex; gap: 8px; padding: 14px 18px 18px; border-top: 1px solid var(--card-soft); }
  #q { flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px; border: 0; background: var(--card-soft); color: inherit; font: 400 1rem var(--body); }
  #q::placeholder { color: rgba(236,235,255,.55); }
  #send { padding: 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 600 1rem var(--body); cursor: pointer; }
  #send:disabled { opacity: .55; cursor: wait; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .about { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding: 56px 0 72px; border-top: 1px solid var(--line); }
  h2 { font: 700 1.5rem var(--display); letter-spacing: -.02em; margin: 0 0 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
  .tags li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; font-weight: 500; font-size: .95rem; }
  .edu { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); display: grid; gap: 18px; }
  .edu b { display: block; } .edu span { color: var(--muted); font-size: .95rem; }
  .about p { margin: 0 0 10px; color: var(--muted); }

  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: .95rem; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; gap: 36px; padding-bottom: 48px; }
    .about { grid-template-columns: 1fr; gap: 32px; }
    .chat { height: 70vh; min-height: 480px; }
    nav a { margin-left: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .dots i { animation: none; opacity: .7; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="#top">Dip Das Gupta</a>
    <nav><a href="#ask">Ask my AI</a></nav>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <div>
      <h1>Hi, I'm Dip Das Gupta.</h1>
      <p class="lead">I study computer science at CUET. This site has an AI that has read my resume, so you can ask it anything about me.</p>
      <a class="cta" href="#ask">Start chatting</a>
    </div>

    <section class="chat" id="ask" aria-label="Chat with Dip's AI">
      <div class="chat-head">
        <div class="avatar" aria-hidden="true">D</div>
        <div><strong>Dip's AI</strong><span>Answers from my resume</span></div>
        <button id="reset" type="button">New chat</button>
      </div>
      <div id="log" aria-live="polite"></div>
      <div id="chips"></div>
      <form id="form">
        <input id="q" placeholder="Ask about skills, projects, education" autocomplete="off" aria-label="Your question" required>
        <button id="send" type="submit">Send</button>
      </form>
    </section>
  </section>

</main>

<footer>
  <div class="wrap">Built by Dip Das Gupta. Code on <a href="https://github.com/dipdasgupta800">GitHub</a>.</div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  const API_URL = "https://dipaibot.onrender.com/chat";
  const SUGGESTIONS = ["What are your skills?", "Tell me about HireMeAI", "Where did you study?"];

  const log = document.getElementById("log");
  const chips = document.getElementById("chips");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");
  let busy = false;

  function show(el, text) {
    if (window.marked && window.DOMPurify) el.innerHTML = DOMPurify.sanitize(marked.parse(text));
    else el.textContent = text;
  }
  function add(text, cls, markdown) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    if (markdown) show(div, text); else div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }
  function reset() {
    log.innerHTML = "";
    add("Hi! I can tell you about Dip's skills, projects, and education. What would you like to know?", "bot");
    chips.innerHTML = "";
    SUGGESTIONS.forEach(function (s) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = s;
      b.onclick = function () { ask(s); };
      chips.appendChild(b);
    });
    chips.hidden = false;
    input.value = "";
  }

  async function ask(question) {
    if (busy || !question) return;
    busy = true; send.disabled = true; chips.hidden = true;
    add(question, "user");
    input.value = "";
    const wait = add("", "bot");
    wait.innerHTML = '<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>';
    const slow = setTimeout(function () {
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = "The server was asleep. The first reply can take up to a minute.";
      wait.appendChild(n);
    }, 6000);
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question })
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();
      show(wait, data.answer);
    } catch (err) {
      wait.className = "msg error";
      wait.textContent = "Could not get an answer (" + err.message + "). Check your connection and try again.";
    } finally {
      clearTimeout(slow);
      busy = false; send.disabled = false;
      log.scrollTop = log.scrollHeight;
      input.focus();
    }
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); ask(input.value.trim()); });
  document.getElementById("reset").addEventListener("click", function () { if (!busy) reset(); });
  reset();
</script>
</body>
</html>
